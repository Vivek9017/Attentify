<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Class Attendance Update</title>
  <link rel="stylesheet" href="css/class-attendance-update.css" />
</head>
<body>
  <div class="class-attendance-update">
    <h1>Update Class Attendance</h1>
    <form>
      <label for="student-name">Student Name:</label>
      <input type="text" id="student-name" name="student-name" required />
      
      <label for="attendance-status">Attendance Status:</label>
      <select id="attendance-status" name="attendance-status">
        <option value="present">Present</option>
        <option value="absent">Absent</option>
      </select>

      <label for="date">Date:</label>
      <input type="date" id="date" name="date" required />

      <button type="submit">Update Attendance</button>
    </form>
    <h2>Attendance Records</h2>
    <table>
      <tr><th>Student Name</th><th>Status</th><th>Date</th></tr>
      <tr><td>John Doe</td><td>Present</td><td>2025-04-10</td></tr>
      <tr><td>Jane Smith</td><td>Absent</td><td>2025-04-10</td></tr>
    </table>
  </div>
</body>
</html>
