<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Teacher Performance Evaluation</title>
  <link rel="stylesheet" href="css/teacher-performance-evaluation.css" />
</head>
<body>
  <div class="teacher-performance-evaluation">
    <h1>Teacher Performance Evaluation</h1>
    <form>
      <label for="teacher-name">Teacher Name:</label>
      <input type="text" id="teacher-name" name="teacher-name" required />

      <label for="subject">Subject:</label>
      <input type="text" id="subject" name="subject" required />

      <label for="performance-rating">Performance Rating:</label>
      <input type="number" id="performance-rating" name="performance-rating" min="1" max="5" required />

      <button type="submit">Submit Evaluation</button>
    </form>
    <h2>Past Evaluations</h2>
    <table>
      <tr><th>Teacher Name</th><th>Subject</th><th>Rating</th></tr>
      <tr><td>John Doe</td><td>Math</td><td>4</td></tr>
      <tr><td>Jane Smith</td><td>Science</td><td>5</td></tr>
    </table>
  </div>
</body>
</html>
