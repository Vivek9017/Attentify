<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher Profile Management</title>
  <link rel="stylesheet" href="css/teacher-profile.css">
</head>
<body>
  <div class="profile">
    <h1>Teacher Profile Management</h1>
    <form>
      <label for="teacher-name">Teacher Name:</label>
      <input type="text" id="teacher-name" name="teacher-name" value="John Doe" required>
      
      <label for="teacher-subject">Subject:</label>
      <input type="text" id="teacher-subject" name="teacher-subject" value="Mathematics" required>
      
      <label for="teacher-email">Email:</label>
      <input type="email" id="teacher-email" name="teacher-email" value="john.doe@example.com" required>
      
      <button type="submit">Save Changes</button>
    </form>
  </div>
</body>
</html>
