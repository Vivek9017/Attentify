<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Material Upload</title>
  <link rel="stylesheet" href="css/study-material.css">
</head>
<body>
  <div class="study-material">
    <h1>Study Material Upload</h1>
    <form>
      <label for="material-name">Material Name:</label>
      <input type="text" id="material-name" name="material-name" required>
      
      <label for="file-upload">Choose File:</label>
      <input type="file" id="file-upload" name="file-upload" required>
      
      <button type="submit">Upload Material</button>
    </form>
    <h2>Uploaded Materials</h2>
    <ul>
      <li>Material 1 <button>Download</button></li>
      <li>Material 2 <button>Download</button></li>
    </ul>
  </div>
</body>
</html>
