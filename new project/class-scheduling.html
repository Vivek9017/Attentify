<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Class Scheduling</title>
  <link rel="stylesheet" href="css/class-scheduling.css">
</head>
<body>
  <div class="class-scheduling">
    <h1>Class Scheduling</h1>
    <form>
      <label for="class-name">Class Name:</label>
      <input type="text" id="class-name" name="class-name" required>
      
      <label for="class-time">Time:</label>
      <input type="time" id="class-time" name="class-time" required>
      
      <button type="submit">Schedule Class</button>
    </form>
    <h2>Scheduled Classes</h2>
    <ul>
      <li>Math 101 - 9:00 AM</li>
      <li>Math 102 - 11:00 AM</li>
    </ul>
  </div>
</body>
</html>
