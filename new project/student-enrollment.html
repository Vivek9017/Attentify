<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Student Enrollment and Registration</title>
  <link rel="stylesheet" href="css/student-enrollment.css" />
</head>
<body>
  <div class="student-enrollment">
    <h1>Student Enrollment and Registration</h1>
    <form>
      <label for="student-name">Student Name:</label>
      <input type="text" id="student-name" name="student-name" required />

      <label for="roll-number">Roll Number:</label>
      <input type="text" id="roll-number" name="roll-number" required />

      <label for="class">Class:</label>
      <select id="class" name="class" required>
        <option value="10th">10th Grade</option>
        <option value="11th">11th Grade</option>
        <option value="12th">12th Grade</option>
      </select>

      <label for="dob">Date of Birth:</label>
      <input type="date" id="dob" name="dob" required />

      <button type="submit">Register</button>
    </form>
  </div>
</body>
</html>
