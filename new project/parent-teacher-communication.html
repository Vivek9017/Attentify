<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Parent-Teacher Communication</title>
  <link rel="stylesheet" href="css/parent-teacher-communication.css" />
</head>
<body>
  <div class="parent-teacher-communication">
    <h1>Parent-Teacher Communication</h1>
    <h2>Messages</h2>
    <ul>
      <li><strong>Teacher: Mr. Smith</strong><br>Message: "Student is performing well in Math."</li>
      <li><strong>Teacher: Mrs. Johnson</strong><br>Message: "Student needs improvement in Science."</li>
    </ul>
    <h2>Send Message</h2>
    <form>
      <label for="message">Message:</label>
      <textarea id="message" name="message" rows="4" required></textarea>
      <button type="submit">Send Message</button>
    </form>
  </div>
</body>
</html>
