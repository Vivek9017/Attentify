<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Submit Assignment</title>
  <link rel="stylesheet" href="css/submit-assignment.css" />
</head>
<body>
  <div class="submit-assignment">
    <h1>Submit Your Assignment</h1>
    <form>
      <label for="subject">Subject:</label>
      <input type="text" id="subject" name="subject" required />

      <label for="assignment-file">Upload File:</label>
      <input type="file" id="assignment-file" name="assignment-file" required />

      <button type="submit">Submit</button>
    </form>
  </div>
</body>
</html>
